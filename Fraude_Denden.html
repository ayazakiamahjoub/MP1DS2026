<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Fraude DenDen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f9;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .fraude {
            font-size: 60px;
            color: red;
            font-weight: bold;
            margin: 20px 0;
        }
        .text {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Analyse de Fraude - Zone DenDen</h1>
        <div class="text">Écart de consommation constaté au mois d'Août :</div>
        
        <!-- C'est ici qu'on affiche le résultat -->
        <div class="fraude">100 kWh</div>
        
        <div class="text">(Compteur : 2000 kWh - Facturé : 1900 kWh)</div>
    </div>

</body>
</html>
